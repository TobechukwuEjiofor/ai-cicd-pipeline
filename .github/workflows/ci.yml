name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: npm test

      - name: Record duration
        run: |
          END_TIME=$(date +%s)
          echo "DURATION_SECONDS=$((END_TIME - START_TIME))" >> $GITHUB_ENV

      - name: Compute diff stats
        if: github.event_name == 'push'
        run: |
          STATS=$(git diff --shortstat HEAD~1 HEAD || echo "")
          FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          ADDED=$(echo "$STATS" | grep -oP '\d+(?= insertion)' || echo 0)
          DELETED=$(echo "$STATS" | grep -oP '\d+(?= deletion)' || echo 0)
          echo "LINES_ADDED=$ADDED" >> $GITHUB_ENV
          echo "LINES_DELETED=$DELETED" >> $GITHUB_ENV
          {
            echo "FILES_CHANGED<<EOF_FILES"
            echo "$FILES"
            echo "EOF_FILES"
          } >> $GITHUB_ENV

      - name: Log build result
        if: github.event_name == 'push'
        env:
          BUILD_RESULT: ${{ steps.run_tests.outcome == 'success' && 'success' || 'failure' }}
          BUILD_DURATION_SECONDS: ${{ env.DURATION_SECONDS }}
          FILES_CHANGED: ${{ env.FILES_CHANGED }}
          LINES_ADDED: ${{ env.LINES_ADDED }}
          LINES_DELETED: ${{ env.LINES_DELETED }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/log-build.js

      - name: Commit and push build log
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-history/build-log.csv
          git diff --cached --quiet || git commit -m "Log build result [skip ci]"
          git push

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1